<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পবিত্র কুরআন | IMRAN ISLAMIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A227;
      --gold-light: #E8CC6A;
      --text: #F3EFE3;
      --muted: #A9B5AE;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(201, 162, 39, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #06371F 0%, #070B0A 60%) fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(900px, 92%); margin: 0 auto; }
    .hidden { display: none !important; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(6, 55, 31, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .brand { font-family: 'Amiri', serif; color: var(--gold-light); font-size: 18px; }
    .btn-back {
      color: var(--gold-light); font: inherit; font-size: 15px;
      background: none; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
    }

    .hero { text-align: center; padding: 36px 0 10px; }
    h1 { font-size: 28px; color: var(--gold-light); margin: 0 0 6px; }
    .muted { color: var(--muted); font-size: 14px; }
    .msg { text-align: center; color: var(--muted); padding: 30px 0; }

    input[type="search"] {
      width: 100%; padding: 12px 16px; margin: 18px 0;
      border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05); color: var(--text);
      font: inherit; font-size: 16px;
    }

    .list { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
    .surah-btn {
      display: flex; align-items: center; gap: 14px;
      width: 100%; text-align: left;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
      color: var(--text); font: inherit; cursor: pointer;
      transition: border-color 0.2s;
    }
    .surah-btn:hover { border-color: var(--gold); }
    .num {
      min-width: 40px; height: 40px; border: 1px solid var(--gold);
      border-radius: 50%; display: grid; place-items: center;
      color: var(--gold); font-size: 14px; flex-shrink: 0;
    }
    .surah-name { font-weight: 600; color: var(--gold-light); }
    .surah-meta { font-size: 13px; color: var(--muted); }
    .ar-name {
      margin-left: auto; font-family: 'Amiri', serif;
      font-size: 20px; color: var(--gold-light);
    }

    .surah-head { text-align: center; padding: 20px 0; }
    .surah-head h2 { font-family: 'Amiri', serif; font-size: 32px; color: var(--gold-light); margin: 0; }

    .verse {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 14px;
    }
    .verse-no { font-size: 13px; color: var(--gold); margin-bottom: 8px; }
    .ar-text {
      font-family: 'Amiri', serif; font-size: 26px;
      direction: rtl; text-align: right; line-height: 2;
      margin: 0 0 10px;
    }
    .bn-text { font-size: 17px; margin: 0; }
    .footer-note { text-align: center; padding: 20px 0 40px; }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <a href="index.html" class="brand">IMRAN ISLAMIC</a>
      <a href="index.html" class="btn-back">← হোম</a>
    </div>
  </header>

  <main class="container">

    <!-- সূরার তালিকা -->
    <section id="listView">
      <div class="hero">
        <h1>পবিত্র কুরআন</h1>
        <p class="muted">১১৪টি সূরা — একটি সূরা বেছে নিন</p>
      </div>
      <input type="search" id="searchBox" placeholder="সূরা খুঁজুন (নাম বা নম্বর)">
      <div id="surahList" class="list">
        <p class="msg">সূরার তালিকা লোড হচ্ছে…</p>
      </div>
    </section>

    <!-- সূরা পড়ার অংশ -->
    <section id="readView" class="hidden">
      <p><button id="backBtn" class="btn-back">← সূরার তালিকা</button></p>
      <div id="surahHead" class="surah-head"></div>
      <div id="verses">
        <p class="msg">লোড হচ্ছে…</p>
      </div>
      <p class="muted footer-note">
        আরবি: alquran.cloud (Uthmani)। বাংলা: Muhiuddin Khan অনুবাদ (fawazahmed0/quran-api)।
      </p>
    </section>

  </main>

  <script>
    const SURAH_LIST_API = "https://api.alquran.cloud/v1/surah";
    const ARABIC_API = "https://api.alquran.cloud/v1/surah";
    const BENGALI_BASE = "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/ben-muhiuddinkhan/";

    const cache = {};   // সূরা নম্বর অনুযায়ী ডেটা জমা রাখে, বারবার ডাউনলোড বাঁচায়
    let allSurahs = [];

    const $ = (selector) => document.querySelector(selector);

    // ===== সূরার তালিকা লোড =====
    async function loadSurahList() {
      try {
        const res = await fetch(SURAH_LIST_API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        allSurahs = json.data;
        renderList(allSurahs);
      } catch (error) {
        $("#surahList").innerHTML =
          '<p class="msg">সূরার তালিকা লোড করা যায়নি। ইন্টারনেট চেক করে পেজ রিফ্রেশ করুন।</p>';
        console.error(error);
      }
    }

    function renderList(items) {
      if (items.length === 0) {
        $("#surahList").innerHTML = '<p class="msg">কোনো সূরা পাওয়া যায়নি।</p>';
        return;
      }
      $("#surahList").innerHTML = items.map((s) => `
        <button class="surah-btn" data-n="${s.number}">
          <div class="num">${s.number}</div>
          <div>
            <div class="surah-name">${s.englishName}</div>
            <div class="surah-meta">${s.englishNameTranslation} · ${s.numberOfAyahs} আয়াত · ${s.revelationType === "Meccan" ? "মক্কী" : "মাদানী"}</div>
          </div>
          <div class="ar-name">${s.name}</div>
        </button>
      `).join("");
    }

    // ===== সার্চ =====
    $("#searchBox").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allSurahs.filter((s) =>
        String(s.number) === q ||
        s.englishName.toLowerCase().includes(q) ||
        s.englishNameTranslation.toLowerCase().includes(q) ||
        s.name.includes(q)
      );
      renderList(filtered);
    });

    // ===== সূরায় ক্লিক =====
    $("#surahList").addEventListener("click", (e) => {
      const btn = e.target.closest(".surah-btn");
      if (btn) openSurah(Number(btn.dataset.n));
    });

    $("#backBtn").addEventListener("click", showList);

    function showList() {
      $("#listView").classList.remove("hidden");
      $("#readView").classList.add("hidden");
      window.scrollTo(0, 0);
    }

    function showRead() {
      $("#listView").classList.add("hidden");
      $("#readView").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    // ===== সূরা খোলা: আরবি ও বাংলা একসাথে =====
    async function openSurah(n) {
      showRead();
      const meta = allSurahs.find((s) => s.number === n);

      $("#surahHead").innerHTML = `
        <h2>${meta.name}</h2>
        <p class="muted">${meta.englishName} · ${meta.englishNameTranslation} · ${meta.numberOfAyahs} আয়াত</p>`;
      $("#verses").innerHTML = '<p class="msg">লোড হচ্ছে…</p>';

      try {
        if (!cache[n]) {
          const [arRes, bnRes] = await Promise.all([
            fetch(`${ARABIC_API}/${n}`),
            fetch(`${BENGALI_BASE}${n}.min.json`)
          ]);
          if (!arRes.ok || !bnRes.ok) throw new Error("API error");

          const arJson = await arRes.json();
          const bnJson = await bnRes.json();

          cache[n] = {
            arabic: arJson.data.ayahs,
            bengali: bnJson.chapter
          };
        }
        renderVerses(cache[n]);
      } catch (error) {
        $("#verses").innerHTML =
          '<p class="msg">সূরাটি লোড করা যায়নি। ইন্টারনেট চেক করে আবার চেষ্টা করুন।</p>';
        console.error(error);
      }
    }

    function renderVerses({ arabic, bengali }) {
      // বাংলা আয়াত নম্বর অনুযায়ী মেলানোর জন্য
      const bnMap = new Map(bengali.map((v) => [v.verse, v.text]));

      $("#verses").innerHTML = arabic.map((a) => `
        <div class="verse">
          <div class="verse-no">আয়াত ${a.numberInSurah}</div>
          <p class="ar-text">${a.text}</p>
          <p class="bn-text">${bnMap.get(a.numberInSurah) || ""}</p>
        </div>
      `).join("");
    }

    loadSurahList();
  </script>
</body>
</html>
